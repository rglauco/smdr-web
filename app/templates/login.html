<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDR — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3d8ef8;
            --primary-light: #5ba3ff;
            --bg: #0c1020;
            --surface: #131929;
            --surface-raised: #1a2238;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e2d47;
            --danger: #ef4444;
            --mono: 'IBM Plex Mono', 'Courier New', monospace;
            --sans: 'IBM Plex Sans', system-ui, sans-serif;
            --dot: #1e2d47;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --primary: #2563eb;
                --primary-light: #3b82f6;
                --bg: #f1f5f9;
                --surface: #ffffff;
                --surface-raised: #f8fafc;
                --text: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --border: #e2e8f0;
                --danger: #dc2626;
                --dot: #cbd5e1;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrapper {
            width: 100%;
            max-width: 380px;
            padding: 0 1rem;
        }
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-brand-icon {
            width: 44px; height: 44px;
            background: rgba(61,142,248,.12);
            border: 1px solid rgba(61,142,248,.25);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: .75rem;
        }
        .login-brand-icon svg { width: 22px; height: 22px; color: var(--primary); }
        .login-brand h1 {
            font-family: var(--mono);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: .5px;
        }
        .login-brand p {
            font-size: .75rem;
            color: var(--text-secondary);
            margin-top: .25rem;
            font-family: var(--mono);
        }
        .login-card {
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
        }
        .form-group { margin-bottom: 1.1rem; }
        .form-group label {
            display: block;
            font-size: .65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            font-family: var(--mono);
            margin-bottom: .38rem;
        }
        .form-group input {
            width: 100%;
            padding: .65rem .85rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .9rem;
            color: var(--text);
            background: var(--surface-raised);
            font-family: var(--mono);
            transition: border-color .2s, box-shadow .2s;
            color-scheme: dark;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(61,142,248,.15);
        }
        .form-group input::placeholder { color: var(--text-muted); }
        .btn-login {
            width: 100%;
            padding: .7rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: .88rem;
            font-weight: 600;
            font-family: var(--sans);
            cursor: pointer;
            transition: background .15s, box-shadow .15s, transform .1s;
            margin-top: .35rem;
        }
        .btn-login:hover {
            background: var(--primary-light);
            box-shadow: 0 2px 14px rgba(61,142,248,.35);
        }
        .btn-login:active { transform: scale(.98); }
        .error-msg {
            background: rgba(239,68,68,.1);
            color: var(--danger);
            padding: .65rem .85rem;
            border-radius: 6px;
            border-left: 3px solid var(--danger);
            font-size: .8rem;
            font-family: var(--mono);
            margin-bottom: 1rem;
            display: {% if error %}block{% else %}none{% endif %};
        }
        .error-msg.visible { display: block; }
        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: .68rem;
            font-family: var(--mono);
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="login-brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
            </div>
            <h1>SMDR Analytics</h1>
            <p>Accesso al sistema di monitoraggio chiamate</p>
        </div>
        <div class="login-card">
            {% if error %}
            <div class="error-msg visible">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Utente</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-login">Accedi</button>
            </form>
        </div>
        <footer>SMDR Call Analytics</footer>
    </div>
</body>
</html>
